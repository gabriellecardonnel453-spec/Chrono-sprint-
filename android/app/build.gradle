plugins {
    id 'com.android.application'
}
android {
    namespace 'fr.chronosprint.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.chronosprint.mobile'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
