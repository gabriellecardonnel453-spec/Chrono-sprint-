name: Construire l'APK Android
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - installation-mobile-android-ios-2026
      - correctif-gps-xiaomi-2026
      - sprint-offline-simple-audio-2026
    paths:
      - 'android/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon-512.png'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Installer les outils Android
        run: |
          SDKM=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKM"
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Installer l'icône
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp icon-512.png android/app/src/main/res/drawable/chrono_sprint.png
      - name: Embarquer l'application hors connexion
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.webmanifest icon-512.png android/app/src/main/assets/
          test -s android/app/src/main/assets/index.html
      - name: Construire l'APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Vérifier l'APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/index.html | grep -q 'Chrono Sprint'
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/index.html | grep -q 'scheduleStartSounds'
      - name: Fournir l'APK à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: Chrono-Sprint-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
